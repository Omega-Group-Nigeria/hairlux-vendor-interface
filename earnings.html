<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Earnings | Hairlux Vendor</title>
  <meta name="description" content="Sell your hair and beauty products through Hairlux. Apply, get verified and list your products." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2E2E2E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hairlux Vendor" />
  <link rel="icon" href="assets/img/pwa/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/img/pwa/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="assets/css/vendor.css" rel="stylesheet" />
</head>
<body>
  <main class="page" id="main">
    <div class="page-head">
      <div><div class="eyebrow">What Hairlux owes you</div><h1>Earnings</h1></div>
    </div>
    <div id="summary"><div class="loading"><span class="spinner"></span></div></div>
    <div class="card">
      <div class="card-head"><h2>Payouts</h2></div>
      <div id="payouts"><div class="loading"><span class="spinner"></span></div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Balance history</h2>
        <div class="filters mb-0" id="filters">
          <button class="chip active" data-type="">All</button>
          <button class="chip" data-type="EARNING">Earnings</button>
          <button class="chip" data-type="RETURN">Returns</button>
          <button class="chip" data-type="PAYOUT">Payouts</button>
          <button class="chip" data-type="ADJUSTMENT">Adjustments</button>
        </div>
      </div>
      <div id="ledger"><div class="loading"><span class="spinner"></span></div></div>
      <div class="row end mt-3"><button class="btn btn-outline btn-sm hidden" id="btn-more">Show more</button></div>
    </div>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/earnings.js"></script>
